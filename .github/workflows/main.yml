
name: Aditya Astra X - Master Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: aditya-astra-x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Diagnose and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment information
        shell: bash
        run: |
          echo "=== ADITYA ASTRA X BUILD ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          date -u
          java -version || true
          echo "Runner workspace: $GITHUB_WORKSPACE"
          df -h

      - name: Inspect uploaded files
        shell: bash
        run: |
          set -eu
          echo "=== Repository files ==="
          find . -maxdepth 4 -type f \
            -not -path './.git/*' | sort | head -n 300

      - name: Extract uploaded project ZIP if present
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/project-extract"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 -type f -iname '*.zip' \
            -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Project ZIP found: $ZIP_FILE"
            unzip -l "$ZIP_FILE" | head -n 100
            unzip -oq "$ZIP_FILE" \
              -d "$RUNNER_TEMP/project-extract"
            echo "ZIP extraction completed."
          else
            echo "No ZIP found. Checking uploaded project files."
          fi

          echo "=== Extracted files ==="
          find "$RUNNER_TEMP/project-extract" \
            -maxdepth 5 -type f | head -n 300 || true

      - name: Detect Android Gradle project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACTED="$RUNNER_TEMP/project-extract"
          FOUND=""

          for BASE in "$ROOT" "$EXTRACTED"; do
            [ -d "$BASE" ] || continue

            FOUND="$(find "$BASE" \
              \( -path '*/.git' -o -path '*/.gradle' \
                 -o -path '*/build' \) -prune -o \
              \( -name settings.gradle.kts \
                 -o -name settings.gradle \) -type f \
              -print -quit || true)"

            if [ -n "$FOUND" ]; then
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::No Gradle settings file found."
            echo "The uploaded ZIP may not contain an Android Gradle project."
            echo "Expected settings.gradle or settings.gradle.kts."
            echo "Repository root:"
            ls -la "$ROOT"
            echo "Extracted project root:"
            ls -la "$EXTRACTED" || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FOUND")"
          echo "Detected settings file: $FOUND"
          echo "Detected project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "=== Project root listing ==="
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed

      - name: Inspect Gradle configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "=== Settings ==="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          else
            cat settings.gradle
          fi

          echo "=== Build files ==="
          find . -maxdepth 4 -type f \
            \( -name build.gradle -o -name build.gradle.kts \
               -o -name gradle-wrapper.properties \) \
            -print

          echo "=== App module ==="
          if [ -d app ]; then
            ls -la app
          else
            echo "::warning::No app directory at project root."
          fi

      - name: Prepare Gradle
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Using project Gradle Wrapper."
            ./gradlew --version
          else
            echo "::warning::Gradle Wrapper missing."
            echo "Using installed Gradle fallback."
            echo "The required Gradle version may differ by project."
          fi

      - name: Set up fallback Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build Android debug APK
        id: build
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          mkdir -p "$RUNNER_TEMP/aditya-reports"

          set +e
          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/aditya-reports/build.log"

          STATUS=${PIPESTATUS[0]}
          set -e

          echo "Build exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Gradle build failed."
            echo "=== Last 150 lines ==="
            tail -n 150 "$RUNNER_TEMP/aditya-reports/build.log"
            exit "$STATUS"
          fi

          echo "Build completed successfully."

      - name: Find and verify APK
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"

          if [ -d "$PROJECT_DIR" ]; then
            find "$PROJECT_DIR" -type f -name '*.apk' \
              -exec cp {} "$GITHUB_WORKSPACE/output/" \; || true
          fi

          echo "=== APK candidates ==="
          find "$GITHUB_WORKSPACE/output" -type f -name '*.apk' \
            -print || true

          APK="$(find "$GITHUB_WORKSPACE/output" \
            -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"

          if [ -n "$APK" ]; then
            cp "$APK" "$GITHUB_WORKSPACE/output/Aditya-Astra-X.apk"
            sha256sum "$GITHUB_WORKSPACE/output/Aditya-Astra-X.apk" \
              > "$GITHUB_WORKSPACE/output/SHA256SUMS.txt"
            ls -lh "$GITHUB_WORKSPACE/output/Aditya-Astra-X.apk"
          else
            echo "::warning::No APK produced; inspect build logs."
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aditya-Astra-X-APK
          path: |
            output/Aditya-Astra-X.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aditya-Astra-X-Debug-Reports
          path: |
            ${{ runner.temp }}/aditya-reports/
            output/
          if-no-files-found: warn
          retention-days: 7
          
